spring.application.name=springBootTest
spring.profiles.active=dev

# ============================ 数据源（MySQL + HikariCP）============================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/link_click_auth?useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=123456
# 连接池
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1400000

# ============================ MyBatis-Plus =============================
mybatis-plus.global-config.banner=false
mybatis-plus.global-config.db-config.id-type=auto
mybatis-plus.global-config.db-config.field-strategy=not_null
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# ============================ 短信验证码（现由重置密码使用）=============================
# 短信验证码有效期（秒）
auth.sms.code-expire-seconds=300
# 两次发送验证码的最小间隔（秒）
auth.sms.resend-interval-seconds=60
# 验证码场景
auth.sms.scene=register
# 过期验证码在库中保留的时长（小时），超过后由定时任务清理
auth.sms.cleanup-retention-hours=24
# 演示模式：true 时把验证码直接返回给前端，方便本地联调（生产环境必须设为 false）
auth.sms.debug=true

# ============================ 图形验证码（注册用）=============================
# 有效期（秒），过期后点击图片重新获取
auth.captcha.expire-seconds=120
# 字符个数
auth.captcha.length=4
# 内存中最多同时保留的验证码数量，超出会淘汰最旧的（防刷内存）
auth.captcha.max-store=10000

# ============================ JWT（登录鉴权）============================
# 签名密钥：生产环境请替换，长度需 >= 32 字节
jwt.secret=LinkClickAuthLocalDevSecretKey_时光代理人_2026
# token 有效期（秒），默认 7 天
jwt.expire-seconds=604800

# ============================ Web / JSON =============================
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Shanghai
spring.jackson.serialization.write-dates-as-timestamps=false

# ============================ 日志 =============================
logging.level.root=info
logging.level.com.fenglin.springboottest=debug
logging.file.name=log/xx.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss}  %level %logger{50}.%M %L:%m%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss}  %level %logger{50}.%M %L:%m%n
