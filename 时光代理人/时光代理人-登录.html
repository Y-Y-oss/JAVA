<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>时光代理人 · 登录</title>
  <style>
/* ===== 时光代理人 · 登录 主题（自包含单文件版） ===== */
:root {
  --bg-deep: #060a18;
  --bg-2: #0a1130;
  --blue: #3a8bff;
  --cyan: #2ee6d6;
  --purple: #a855f7;
  --ink: #eaf2ff;
  --ink-soft: #9fb2d6;
  --line: rgba(150, 180, 255, 0.18);
  --glass: rgba(18, 28, 58, 0.55);
  --glass-strong: rgba(20, 32, 66, 0.78);
  --glow-blue: rgba(58, 139, 255, 0.55);
  --glow-cyan: rgba(46, 230, 214, 0.45);
  --danger: #ff6b81;
  --ok: #46e8a0;
  --radius: 16px;
  --font: "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  color: var(--ink);
  background: var(--bg-deep);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow-x: hidden;
  position: relative;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background:
    radial-gradient(900px 600px at 18% 12%, rgba(58, 139, 255, 0.22), transparent 60%),
    radial-gradient(800px 700px at 85% 88%, rgba(168, 85, 247, 0.20), transparent 60%),
    radial-gradient(600px 500px at 70% 20%, rgba(46, 230, 214, 0.12), transparent 60%),
    linear-gradient(160deg, var(--bg-deep), var(--bg-2));
  z-index: -2;
}
body::after {
  content: "";
  position: fixed;
  inset: 0;
  background-image:
    radial-gradient(1.5px 1.5px at 20% 30%, rgba(255,255,255,.7), transparent),
    radial-gradient(1.5px 1.5px at 75% 22%, rgba(255,255,255,.5), transparent),
    radial-gradient(1px 1px at 50% 70%, rgba(255,255,255,.6), transparent),
    radial-gradient(1.5px 1.5px at 88% 65%, rgba(255,255,255,.5), transparent),
    radial-gradient(1px 1px at 32% 82%, rgba(255,255,255,.5), transparent),
    radial-gradient(1px 1px at 62% 45%, rgba(255,255,255,.4), transparent);
  z-index: -1;
  animation: twinkle 6s ease-in-out infinite alternate;
}
@keyframes twinkle { from { opacity: .35; } to { opacity: .8; } }
.auth {
  width: min(960px, 94vw);
  min-height: 600px;
  display: grid;
  grid-template-columns: 1.05fr 1fr;
  background: var(--glass-strong);
  border: 1px solid var(--line);
  border-radius: 24px;
  overflow: hidden;
  backdrop-filter: blur(18px);
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255,255,255,.05);
}
.visual {
  position: relative;
  padding: 44px 40px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  background: linear-gradient(150deg, rgba(58,139,255,.16), rgba(168,85,247,.14));
  overflow: hidden;
}
.portal {
  position: absolute;
  top: 50%; left: 50%;
  width: 520px; height: 520px;
  transform: translate(-50%, -50%);
  pointer-events: none;
  opacity: .9;
}
.portal span {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 1px solid var(--line);
  border-top-color: rgba(46, 230, 214, .55);
  border-right-color: rgba(58, 139, 255, .55);
  animation: spin 14s linear infinite;
}
.portal span:nth-child(1) { inset: 0;   animation-duration: 16s; }
.portal span:nth-child(2) { inset: 60px;  animation-duration: 12s; animation-direction: reverse; border-top-color: rgba(168,85,247,.6); border-right-color: rgba(46,230,214,.5);}
.portal span:nth-child(3) { inset: 130px; animation-duration: 9s;  border-top-color: rgba(58,139,255,.6); border-right-color: rgba(168,85,247,.5);}
.portal span:nth-child(4) { inset: 200px; animation-duration: 7s;  animation-direction: reverse; border-top-color: rgba(46,230,214,.7); }
.portal::after {
  content: "";
  position: absolute;
  inset: 215px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(46,230,214,.35), rgba(58,139,255,.12) 55%, transparent 75%);
  filter: blur(6px);
}
@keyframes spin { to { transform: rotate(360deg); } }
.brand { position: relative; z-index: 2; }
.brand .logo {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-weight: 600;
  letter-spacing: 2px;
  font-size: 13px;
  color: var(--cyan);
}
.brand .logo .dot {
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--cyan);
  box-shadow: 0 0 12px var(--glow-cyan);
}
.visual h1 {
  position: relative; z-index: 2;
  font-size: 40px;
  line-height: 1.15;
  font-weight: 700;
  margin-top: 18px;
  background: linear-gradient(120deg, #fff, var(--cyan) 55%, var(--blue));
  -webkit-background-clip: text; background-clip: text; color: transparent;
  text-shadow: 0 0 30px rgba(46,230,214,.25);
}
.visual .en {
  position: relative; z-index: 2;
  margin-top: 8px;
  font-size: 13px;
  letter-spacing: 6px;
  color: var(--ink-soft);
  text-transform: uppercase;
}
.visual .tagline {
  position: relative; z-index: 2;
  margin-top: 16px;
  font-size: 14px;
  color: var(--ink-soft);
  max-width: 280px;
  line-height: 1.7;
}
.visual .foot {
  position: relative; z-index: 2;
  font-size: 12px;
  color: rgba(159,178,214,.6);
}
.form-side {
  padding: 44px 42px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.form-side h2 { font-size: 26px; font-weight: 700; margin-bottom: 6px; }
.form-side .sub { font-size: 13px; color: var(--ink-soft); margin-bottom: 26px; }
.field { margin-bottom: 18px; position: relative; }
.field label { display: block; font-size: 13px; color: var(--ink-soft); margin-bottom: 8px; }
.field .input-wrap { position: relative; display: flex; align-items: center; }
.field input {
  width: 100%;
  padding: 13px 44px 13px 16px;
  background: rgba(10, 16, 38, 0.6);
  border: 1px solid var(--line);
  border-radius: 12px;
  color: var(--ink);
  font-size: 14px;
  outline: none;
  transition: border-color .2s, box-shadow .2s, background .2s;
}
.field input::placeholder { color: rgba(159,178,214,.45); }
.field input:focus {
  border-color: var(--blue);
  box-shadow: 0 0 0 3px rgba(58,139,255,.18);
  background: rgba(10, 16, 38, 0.85);
}
.field .icon {
  position: absolute;
  right: 14px;
  width: 20px; height: 20px;
  display: grid; place-items: center;
  color: var(--ink-soft);
  cursor: pointer;
  border: none; background: none; padding: 0;
}
.field .icon svg { width: 18px; height: 18px; }
.field.error input { border-color: var(--danger); box-shadow: 0 0 0 3px rgba(255,107,129,.16); }
.field .msg {
  font-size: 12px;
  color: var(--danger);
  margin-top: 6px;
  min-height: 14px;
  display: none;
}
.field.error .msg { display: block; }
.row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 13px;
  margin: 4px 0 22px;
}
.row label { display: inline-flex; align-items: center; gap: 8px; color: var(--ink-soft); cursor: pointer; }
.row input[type="checkbox"] { accent-color: var(--blue); width: 15px; height: 15px; }
.row a { color: var(--cyan); text-decoration: none; }
.row a:hover { text-decoration: underline; }
.btn {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 600;
  color: #04122b;
  cursor: pointer;
  background: linear-gradient(120deg, var(--cyan), var(--blue) 60%, var(--purple));
  background-size: 200% 100%;
  transition: transform .15s, box-shadow .25s, background-position .4s;
  box-shadow: 0 12px 30px rgba(58,139,255,.35);
}
.btn:hover { transform: translateY(-1px); background-position: 100% 0; box-shadow: 0 16px 40px rgba(46,230,214,.4); }
.btn:active { transform: translateY(0); }
.divider {
  display: flex; align-items: center; gap: 12px;
  margin: 22px 0;
  color: var(--ink-soft);
  font-size: 12px;
}
.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.social { display: flex; gap: 12px; }
.social button {
  flex: 1;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  padding: 11px;
  background: rgba(10,16,38,.5);
  border: 1px solid var(--line);
  border-radius: 12px;
  color: var(--ink);
  font-size: 13px;
  cursor: pointer;
  transition: border-color .2s, background .2s;
}
.social button:hover { border-color: var(--blue); background: rgba(58,139,255,.1); }
.social svg { width: 18px; height: 18px; }
.switch {
  text-align: center;
  margin-top: 24px;
  font-size: 13px;
  color: var(--ink-soft);
}
.switch a { color: var(--cyan); text-decoration: none; font-weight: 600; }
.switch a:hover { text-decoration: underline; }
.toast {
  position: fixed;
  left: 50%; bottom: 36px;
  transform: translateX(-50%) translateY(20px);
  background: var(--glass-strong);
  border: 1px solid var(--line);
  color: var(--ink);
  padding: 12px 22px;
  border-radius: 999px;
  font-size: 14px;
  backdrop-filter: blur(10px);
  opacity: 0;
  pointer-events: none;
  transition: opacity .3s, transform .3s;
  z-index: 50;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.ok { border-color: rgba(70,232,160,.5); }
.toast.err { border-color: rgba(255,107,129,.5); }
@media (max-width: 820px) {
  .auth { grid-template-columns: 1fr; min-height: auto; }
  .visual { display: none; }
  .form-side { padding: 40px 28px; }
}
  </style>
</head>
<body>
  <main class="auth">
    <section class="visual">
      <div class="portal"><span></span><span></span><span></span><span></span></div>
      <div class="brand">
        <span class="logo"><span class="dot"></span>LINK CLICK</span>
      </div>
      <div>
        <h1>时光代理人</h1>
        <div class="en">Dive into the moment</div>
        <p class="tagline">潜入照片，定格瞬间。登录时光照相馆，开启你的时间潜行。</p>
      </div>
      <div class="foot">© 时光照相馆 · 仅作前端演示，非官方页面</div>
    </section>

    <section class="form-side">
      <h2>欢迎回来</h2>
      <p class="sub">登录以继续你的时光之旅</p>

      <form id="authForm" data-mode="login" novalidate>
        <div class="field">
          <label for="account">邮箱 / 用户名</label>
          <div class="input-wrap">
            <input id="account" type="text" placeholder="name@linkclick.cn" data-validate="account" autocomplete="username" />
          </div>
          <div class="msg"></div>
        </div>

        <div class="field">
          <label for="password">密码</label>
          <div class="input-wrap">
            <input id="password" type="password" placeholder="请输入密码" data-validate="password" autocomplete="current-password" />
            <button type="button" class="icon toggle-pw" data-target="password" aria-label="显示密码">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
          <div class="msg"></div>
        </div>

        <div class="row">
          <label><input type="checkbox" checked /> 记住我</label>
          <a href="#">忘记密码？</a>
        </div>

        <button type="submit" id="submitBtn" class="btn">登 录</button>

        <div class="divider">其他登录方式</div>
        <div class="social">
          <button type="button">
            <svg viewBox="0 0 24 24" fill="#2ee6d6"><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2Zm0 4a3 3 0 1 1 0 6 3 3 0 0 1 0-6Zm0 14c-2.4 0-4.6-1.1-6-2.9.8-1.9 4-3 6-3s5.2 1.1 6 3c-1.4 1.8-3.6 2.9-6 2.9Z"/></svg>
            微信
          </button>
          <button type="button">
            <svg viewBox="0 0 24 24" fill="#3a8bff"><path d="M12 2C6.5 2 2 5.9 2 10.6c0 2.6 1.5 4.9 3.8 6.4L5 20l3-1.6c.9.2 1.9.4 3 .4 5.5 0 10-3.9 10-8.8S17.5 2 12 2Z"/></svg>
            QQ
          </button>
        </div>

        <div class="switch">还没有账号？<a href="#">立即注册</a></div>
      </form>
    </section>
  </main>

  <script>
  (function () {
    "use strict";
    var $ = function (sel, ctx) { return (ctx || document).querySelector(sel); };
    var form = $("#authForm");
    if (!form) return;
    var mode = form.dataset.mode;

    document.querySelectorAll(".toggle-pw").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var input = $("#" + btn.dataset.target);
        if (!input) return;
        var show = input.type === "password";
        input.type = show ? "text" : "password";
        btn.setAttribute("aria-label", show ? "隐藏密码" : "显示密码");
      });
    });

    var validators = {
      account: function (v) { if (!v.trim()) return "请输入邮箱或用户名"; return ""; },
      email: function (v) {
        if (!v.trim()) return "请输入邮箱";
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) return "邮箱格式不正确";
        return "";
      },
      username: function (v) { if (!v.trim()) return "请输入用户名"; if (v.trim().length < 2) return "用户名至少 2 个字符"; return ""; },
      password: function (v) {
        if (!v) return "请输入密码";
        if (v.length < 8) return "密码至少 8 位，含字母与数字";
        if (!/[a-zA-Z]/.test(v) || !/\d/.test(v)) return "密码需同时包含字母和数字";
        return "";
      },
      confirm: function (v) {
        var pw = $("#password").value;
        if (!v) return "请再次输入密码";
        if (v !== pw) return "两次输入的密码不一致";
        return "";
      }
    };

    function setError(field, msg) {
      var wrap = field.closest(".field");
      var msgEl = $(".msg", wrap);
      if (msg) { wrap.classList.add("error"); if (msgEl) msgEl.textContent = msg; }
      else { wrap.classList.remove("error"); }
    }

    form.querySelectorAll("[data-validate]").forEach(function (input) {
      input.addEventListener("blur", function () {
        var rule = validators[input.dataset.validate];
        if (rule) setError(input, rule(input.value));
      });
      input.addEventListener("input", function () {
        if (input.closest(".field").classList.contains("error")) {
          var rule = validators[input.dataset.validate];
          if (rule) setError(input, rule(input.value));
        }
      });
    });

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var ok = true;
      form.querySelectorAll("[data-validate]").forEach(function (input) {
        var rule = validators[input.dataset.validate];
        var msg = rule ? rule(input.value) : "";
        setError(input, msg);
        if (msg) ok = false;
      });

      if (mode === "register") {
        var agree = $("#agree");
        if (agree && !agree.checked) { toast("请先阅读并同意用户协议", "err"); ok = false; }
      }

      if (!ok) { toast("请检查表单中的错误项", "err"); return; }

      var btn = $("#submitBtn");
      var original = btn.textContent;
      btn.disabled = true;
      btn.textContent = "正在穿越时光…";

      setTimeout(function () {
        btn.disabled = false;
        btn.textContent = original;
        if (mode === "login") toast("登录成功，欢迎回到时光照相馆", "ok");
        else toast("注册成功，已为你开启时光之眼", "ok");
      }, 1200);
    });

    var toastTimer;
    function toast(text, type) {
      var el = $("#toast");
      if (!el) {
        el = document.createElement("div");
        el.id = "toast";
        el.className = "toast";
        document.body.appendChild(el);
      }
      el.textContent = text;
      el.className = "toast show" + (type ? " " + type : "");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { el.className = "toast"; }, 2600);
    }
  })();
  </script>
</body>
</html>
